name: Actualizar y publicar

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 9 * * *' # cada día a las 9:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run fetch
      - name: Guardar datos nuevos
        run: |
          git config user.name "actualizador"
          git config user.email "actions@users.noreply.github.com"
          git add data/mensual.json
          git diff --cached --quiet || (git commit -m "Euríbor actualizado" && git push)
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - uses: actions/deploy-pages@v4
